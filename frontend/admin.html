<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#042555" />
    <meta
      name="description"
      content="Acesso do administrador ao painel da loja VeriSeal Delivery."
    />
    <meta name="robots" content="noindex" />
    <title>Área do administrador | VeriSeal Delivery</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/img/favicon-32.png"
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body
    class="login-page min-h-screen bg-surface px-5 py-6 text-fg antialiased max-sm:px-3 max-sm:py-3"
  >
    <main
      class="mx-auto flex min-h-[calc(100svh-48px)] w-full max-w-[1200px] items-center justify-center max-sm:min-h-[calc(100svh-24px)]"
    >
      <section
        class="login-layout grid w-full overflow-hidden rounded-[28px] bg-white shadow-[0_28px_90px_rgba(4,37,85,.16)] max-sm:grid-cols-1 max-sm:rounded-[22px]"
        aria-label="Acesso do administrador"
      >
        <aside
          class="login-visual relative flex min-h-[660px] flex-col overflow-hidden p-10 text-white max-lg:min-h-[620px] max-lg:p-8 max-sm:min-h-0 max-sm:px-6 max-sm:pt-6 max-sm:pb-7"
          aria-label="VeriSeal Delivery"
        >
          <a
            class="relative z-10 inline-flex w-fit items-center gap-2.5 rounded-lg text-white no-underline"
            href="index.html"
            aria-label="VeriSeal Delivery, voltar à loja"
          >
            <img
              class="aspect-wordmark h-[22px] w-auto max-sm:h-[18px]"
              src="assets/brand/logo-dark-bg.svg"
              alt=""
            />
            <span
              class="rounded-md bg-white px-2 py-[3px] text-[12px] leading-[1.2] font-bold tracking-[.04em] text-navy uppercase max-sm:text-[11px]"
              >Delivery</span
            >
          </a>

          <div
            class="relative z-10 my-auto max-w-[400px] py-6 max-sm:max-w-[64%] max-sm:pt-8 max-sm:pb-0"
          >
            <p
              class="text-[clamp(30px,3.4vw,44px)] leading-[1.08] font-extrabold tracking-[-.045em] max-sm:text-[28px]"
            >
              Cada pedido,<br class="max-sm:hidden" />
              do clique à entrega.
            </p>
            <p
              class="mt-4 max-w-[330px] text-[15px] leading-7 text-white/72 max-sm:hidden"
            >
              Acompanhe os pedidos da loja, atualize cada entrega e confira os
              lacres de todas as garrafas.
            </p>
          </div>

          <div class="login-photo" aria-hidden="true">
            <img
              src="assets/photos/entregador.webp"
              alt=""
              width="1086"
              height="1448"
              fetchpriority="high"
              decoding="async"
              draggable="false"
            />
          </div>
        </aside>

        <div
          class="flex min-w-0 flex-col justify-center px-[clamp(32px,6vw,76px)] py-12 max-sm:px-6 max-sm:py-8"
        >
          <a
            class="mb-8 inline-flex w-fit items-center gap-1.5 text-[13px] font-semibold text-fg-2 no-underline transition-colors hover:text-accent"
            href="index.html"
          >
            <i class="icon icon-chev-l size-4" aria-hidden="true"></i>
            <span>Voltar à loja</span>
          </a>

          <p
            class="mb-2 text-[12px] font-bold tracking-[.13em] text-accent uppercase"
          >
            Área do administrador
          </p>
          <h1
            class="text-[32px] leading-tight font-extrabold tracking-[-.04em] text-navy max-sm:text-[28px]"
          >
            Painel da loja
          </h1>
          <p class="mt-2 text-[14px] leading-6 text-fg-2">
            Entre com a conta de administrador para acompanhar os pedidos.
          </p>

          <div class="mt-7">
            <form id="adminLogin" data-auth-form="login" novalidate>
              <div>
                <label
                  class="block text-[13px] font-semibold text-fg"
                  for="adminEmail"
                  >E-mail</label
                >
                <input
                  class="login-input mt-2 w-full rounded-xl border border-line bg-white px-4 py-3 text-[15px] text-fg placeholder:text-fg-3"
                  id="adminEmail"
                  name="email"
                  type="email"
                  placeholder="admin@veriseal.com.br"
                  autocomplete="username"
                  required
                />
              </div>

              <div>
                <label
                  class="text-[13px] font-semibold text-fg"
                  for="adminPassword"
                  >Senha</label
                >
                <div class="relative mt-2">
                  <input
                    class="login-input w-full rounded-xl border border-line bg-white px-4 py-3 pr-14 text-[15px] text-fg placeholder:text-fg-3"
                    id="adminPassword"
                    name="senha"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                  />
                  <button
                    class="login-password-toggle absolute inset-y-0 right-0 px-4 text-[12px] font-semibold text-fg-2 hover:text-accent"
                    type="button"
                    data-password-toggle="adminPassword"
                    aria-label="Mostrar senha"
                    aria-pressed="false"
                  >
                    Mostrar
                  </button>
                </div>
              </div>

              <p class="form-error" id="adminError" role="alert" hidden></p>

              <button
                class="btn btn-primary w-full rounded-xl py-3.5"
                type="submit"
              >
                <i class="icon icon-lock" aria-hidden="true"></i>
                Entrar no painel
              </button>
            </form>
          </div>

          <p
            class="mt-5 rounded-xl bg-surface px-4 py-3 text-[12px] leading-5 text-fg-2"
            id="adminNotice"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </div>
      </section>
    </main>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
