# Ambiente do GitHub Codespaces: dois contêineres na mesma rede.
#   app   -> .NET 10 (roda a API em C#, que também mostra o site)
#   banco -> MySQL 8.4, criado na primeira vez com database/schema.sql + database/dados.sql
services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:10.0
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # mesma rede do banco: dentro do app, o MySQL fica em localhost:3306
    network_mode: service:banco
    depends_on:
      - banco

  banco:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: veriseal
      TZ: America/Sao_Paulo
    volumes:
      # os dados ficam guardados entre um uso e outro do Codespace
      - dados-mysql:/var/lib/mysql
      # só rodam quando o banco é criado (primeira vez)
      - ../database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ../database/dados.sql:/docker-entrypoint-initdb.d/2-dados.sql:ro

volumes:
  dados-mysql:
